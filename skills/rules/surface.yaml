rules:
  # --- PYTHON SURFACE ---
  - id: python-surface-source
    patterns:
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.cookies
          - pattern: flask.request
    message: "Potential Input Source (Python)"
    languages: [python]
    severity: INFO
    metadata:
      tag: surface
      type: source

  - id: python-surface-sink
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.Popen(...)
          - pattern: os.system(...)
          - pattern: $CURSOR.execute(...)
    message: "Potential Dangerous Sink (Python)"
    languages: [python]
    severity: INFO
    metadata:
      tag: surface
      type: sink

  # --- JAVA SURFACE ---
  - id: java-surface-source
    patterns:
      - pattern-either:
          - pattern: |
              $RET $METHOD(..., HttpServletRequest $REQ, ...) { ... }
          - pattern: |
              @RequestParam(...) $TYPE $VAR
    message: "Potential Input Source (Java)"
    languages: [java]
    severity: INFO
    metadata:
      tag: surface
      type: source

  - id: java-surface-sink
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec(...)
          - pattern: new ProcessBuilder(...)
          - pattern: $STMT.executeQuery(...)
          - pattern: $STMT.executeUpdate(...)
    message: "Potential Dangerous Sink (Java)"
    languages: [java]
    severity: INFO
    metadata:
      tag: surface
      type: sink
