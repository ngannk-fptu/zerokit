[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerokit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
description = "Whitebox pentest agent harness"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
]
tools = [
    "semgrep>=1.60",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external tools",
]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["tools/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/harness/detect_repo_profile.py" = ["E501"]
